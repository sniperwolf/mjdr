name: Test and Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false

      test_type:
        description: 'Type of tests to run'
        required: true
        type: choice
        options:
          - all
          - unit
          - integration
        default: 'all'

      os_matrix:
        description: 'Run tests on multiple OS'
        required: false
        type: boolean
        default: false

      coverage:
        description: 'Generate coverage report'
        required: false
        type: boolean
        default: true

      shellcheck:
        description: 'Run ShellCheck analysis'
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      debug_mode: ${{ steps.set-vars.outputs.debug_mode }}
      test_type: ${{ steps.set-vars.outputs.test_type }}
      os_matrix: ${{ steps.set-vars.outputs.os_matrix }}
      coverage: ${{ steps.set-vars.outputs.coverage }}
      shellcheck: ${{ steps.set-vars.outputs.shellcheck }}

    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set default values for auto-trigger
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "DEFAULT_DEBUG_MODE=false" >> $GITHUB_ENV
          echo "DEFAULT_TEST_TYPE=all" >> $GITHUB_ENV
          echo "DEFAULT_OS_MATRIX=true" >> $GITHUB_ENV
          echo "DEFAULT_COVERAGE=true" >> $GITHUB_ENV
          echo "DEFAULT_SHELLCHECK=true" >> $GITHUB_ENV

      - name: Set input values
        id: set-vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "debug_mode=${{ inputs.debug_mode }}" >> $GITHUB_OUTPUT
            echo "test_type=${{ inputs.test_type }}" >> $GITHUB_OUTPUT
            echo "os_matrix=${{ inputs.os_matrix }}" >> $GITHUB_OUTPUT
            echo "coverage=${{ inputs.coverage }}" >> $GITHUB_OUTPUT
            echo "shellcheck=${{ inputs.shellcheck }}" >> $GITHUB_OUTPUT
          else
            echo "debug_mode=$DEFAULT_DEBUG_MODE" >> $GITHUB_OUTPUT
            echo "test_type=$DEFAULT_TEST_TYPE" >> $GITHUB_OUTPUT
            echo "os_matrix=$DEFAULT_OS_MATRIX" >> $GITHUB_OUTPUT
            echo "coverage=$DEFAULT_COVERAGE" >> $GITHUB_OUTPUT
            echo "shellcheck=$DEFAULT_SHELLCHECK" >> $GITHUB_OUTPUT
          fi

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y bats shellcheck netcat-openbsd \
            binutils-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev build-essential

          # Install kcov from source
          wget https://github.com/SimonKagstrom/kcov/archive/master.tar.gz
          tar xzf master.tar.gz
          cd kcov-master
          mkdir build
          cd build
          cmake ..
          make
          sudo make install
          cd ../..
          rm -rf kcov-master master.tar.gz

          # Install BATS dependencies
          git clone https://github.com/bats-core/bats-support.git /tmp/bats-support
          git clone https://github.com/bats-core/bats-assert.git /tmp/bats-assert
          sudo mkdir -p /usr/local/lib/bats/
          sudo mv /tmp/bats-support /usr/local/lib/bats/
          sudo mv /tmp/bats-assert /usr/local/lib/bats/

          docker --version
          docker compose version

      - name: Run ShellCheck
        if: ${{ steps.set-vars.outputs.shellcheck == 'true' }}
        run: |
          shellcheck -e SC1090,SC1091 libs/*.sh *.sh

      - name: Run Unit Tests
        if: ${{ steps.set-vars.outputs.test_type == 'all' || steps.set-vars.outputs.test_type == 'unit' }}
        run: |
          bats tests/unit/*.bats
        env:
          TERM: xterm-256color
          DEBUG: ${{ steps.set-vars.outputs.debug_mode }}

      - name: Run Integration Tests
        if: ${{ steps.set-vars.outputs.test_type == 'all' || steps.set-vars.outputs.test_type == 'integration' }}
        run: |
          bats tests/integration/*.bats
        env:
          TERM: xterm-256color
          DEBUG: ${{ steps.set-vars.outputs.debug_mode }}

      - name: Generate Coverage Report
        if: ${{ steps.set-vars.outputs.coverage == 'true' }}
        run: |
          kcov --include-pattern=.sh \
               --exclude-pattern=.bats,.env.example,tests/ \
               coverage/ \
               bats tests/unit/*.bats tests/integration/*.bats

      - name: Upload Coverage Report
        if: ${{ steps.set-vars.outputs.coverage == 'true' }}
        uses: codecov/codecov-action@v4.0.1
        with:
          files: ./coverage/*/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive code coverage results
        if: ${{ steps.set-vars.outputs.coverage == 'true' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 90

  test-matrix:
    needs: test
    if: ${{ needs.test.outputs.os_matrix == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4.1.1

      - name: Set up environment (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y bats shellcheck netcat-openbsd
          else
            brew install bats shellcheck netcat
          fi

      - name: Set up environment (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install bats shellcheck netcat
        shell: pwsh

      - name: Run Tests
        run: |
          bats tests/unit/*.bats
        env:
          TERM: xterm-256color
          DEBUG: ${{ needs.test.outputs.debug_mode }}

  test-summary:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Create Test Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Configuration:" >> $GITHUB_STEP_SUMMARY
          echo "- Debug Mode: ${{ needs.test.outputs.debug_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Type: ${{ needs.test.outputs.test_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- OS Matrix: ${{ needs.test.outputs.os_matrix }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: ${{ needs.test.outputs.coverage }}" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck: ${{ needs.test.outputs.shellcheck }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Main tests completed" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.outputs.os_matrix }}" = "true" ]; then
            echo "✅ OS Matrix tests completed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.test.outputs.coverage }}" = "true" ]; then
            echo "📊 Coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
          fi
